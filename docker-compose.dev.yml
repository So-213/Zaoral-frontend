# Zaoral - 開発用 Docker Compose
# ホットリロード付きで開発環境を起動
# 使用方法: docker compose -f docker-compose.dev.yml up　イメージを立ち上げる
# docker compose up --build　　ビルドしてイメージを作り直してから立ち上げる

services:
  # localhostだとホストのPostgreSQLには直接つながらないため、自前で用意したものを使用
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaoral
      POSTGRES_PASSWORD: zaoral_dev_password
      POSTGRES_DB: zaoral
    ports:
      - "5432:5432"
    volumes:
      - zaoral_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaoral -d zaoral"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:22.9.0-slim
    working_dir: /app
    command: sh -c "npm ci && npx prisma generate && npx prisma migrate deploy && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://zaoral:zaoral_dev_password@db:5432/zaoral
      DIRECT_URL: postgresql://zaoral:zaoral_dev_password@db:5432/zaoral
      # Spring Boot(ホストのPleiadesで起動)の接続先。コンテナ内の localhost はコンテナ自身を指すため host.docker.internal を使う
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_LINE_ID: ${AUTH_LINE_ID}
      AUTH_LINE_SECRET: ${AUTH_LINE_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      NEXT_PUBLIC_PROJECT_DISPLAY_URL: ${NEXT_PUBLIC_PROJECT_DISPLAY_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  # 期限切れプロジェクト削除のcron(busybox crond)。
  # 叩く先はホストのSpring Bootで、削除の判定はバックエンド側の責務。
  # スケジュールは ops/cron/crontab、実行内容は ops/cron/cleanup-expired-projects.sh。
  # 詳細は Zaoral-backend-springboot の README「期限切れプロジェクトの削除」参照。
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080}
      # 未設定でも up は通す(ここで必須にすると、cronのためにスタック全体が起動できなくなる)。
      # 未設定のまま実行されるとスクリプトが理由付きで失敗し、docker logs に出る
      CRON_SECRET: ${CRON_SECRET:-}
      # crontab の実行時刻はUTC基準(置き換え元のVercel Cronと同じ)。ホストのTZに依存させない
      TZ: UTC
    volumes:
      # busybox crond が読むのは /etc/crontabs/<ユーザー名>
      - ./ops/cron/crontab:/etc/crontabs/root:ro
      - ./ops/cron/cleanup-expired-projects.sh:/usr/local/bin/cleanup-expired-projects:ro
    # Docker Desktop では既定で解決できるが、Linuxホストでは明示しないと host.docker.internal が引けない
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # -f: フォアグラウンド実行(コンテナのPID 1として動かす) / -l 8: crond自身のログを出させる
    command: >
      sh -c "apk add --no-cache curl > /dev/null &&
             export -p > /etc/cron.env &&
             exec crond -f -l 8"

  # pgAdmin（DBをブラウザから確認する用）
  # 使用方法: http://localhost:5050 （ログイン: admin@zaoral.dev / admin）
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zaoral.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - zaoral_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  zaoral_postgres_data:
  zaoral_pgadmin_data:


