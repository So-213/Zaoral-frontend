# Zaoral - 開発用 Docker Compose
# ホットリロード付きで開発環境を起動
# 使用方法: docker compose -f docker-compose.dev.yml up　イメージを立ち上げる
# docker compose up --build　　ビルドしてイメージを作り直してから立ち上げる
#
# DBロールは db の初回起動時に ops/db/init/01-roles.sql で作られる。
# 既存ボリュームには流れないため、初回導入時は一度作り直すこと(開発データは消える):
#   docker compose -f docker-compose.dev.yml down -v

services:
  # localhostだとホストのPostgreSQLには直接つながらないため、自前で用意したものを使用
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaoral
      POSTGRES_PASSWORD: zaoral_dev_password
      POSTGRES_DB: zaoral
    ports:
      - "5432:5432"
    volumes:
      - zaoral_postgres_data:/var/lib/postgresql/data
      # ロール(zaoral_migrator / zaoral_app)を作成する初期化SQL。
      # 初回起動時(=上のボリュームが空のとき)のみ実行される
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaoral -d zaoral"]
      interval: 5s
      timeout: 5s
      retries: 5

  # マイグレーション専用。流し終えたら終了する使い捨てサービス(常駐しない)。
  # DDL権限を持つ zaoral_migrator で接続するのはここだけで、appはDMLしかできない。
  # これにより、アプリ側の実装ミスやSQLインジェクションでテーブルを壊せなくなる。
  # ロール定義は ops/db/init/01-roles.sql 参照。
  #
  # 新しいマイグレーションを作る場合(migrate dev)もこのサービス経由で実行する:
  #   docker compose -f docker-compose.dev.yml run --rm migrate npx prisma migrate dev --name xxx
  migrate:
    image: node:22.9.0-slim
    working_dir: /app
    command: sh -c "npm ci && npx prisma generate && npx prisma migrate deploy"
    volumes:
      - .:/app
      - zaoral_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://zaoral_migrator:zaoral_migrator_dev_password@db:5432/zaoral
      DIRECT_URL: postgresql://zaoral_migrator:zaoral_migrator_dev_password@db:5432/zaoral
    depends_on:
      db:
        condition: service_healthy

  app:
    image: node:22.9.0-slim
    working_dir: /app
    # npm ci / prisma generate / migrate deploy は migrate サービスへ移動済み
    command: sh -c "npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # migrate サービスが npm ci した成果を共有するため名前付きボリュームにする。
      # 匿名ボリューム(- /app/node_modules)だとサービスごとに別物になり、appから見えない
      - zaoral_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://zaoral_app:zaoral_app_dev_password@db:5432/zaoral
      DIRECT_URL: postgresql://zaoral_app:zaoral_app_dev_password@db:5432/zaoral
      # Spring Boot(ホストのPleiadesで起動)の接続先。コンテナ内の localhost はコンテナ自身を指すため host.docker.internal を使う
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_LINE_ID: ${AUTH_LINE_ID}
      AUTH_LINE_SECRET: ${AUTH_LINE_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      NEXT_PUBLIC_PROJECT_DISPLAY_URL: ${NEXT_PUBLIC_PROJECT_DISPLAY_URL:-http://localhost:3000}
    depends_on:
      # マイグレーションが正常終了(終了コード0)するまでappを起動しない。
      # 失敗した場合はappが起動しないので、スキーマ不整合のまま動き出すことがない
      migrate:
        condition: service_completed_successfully

  # 期限切れプロジェクト削除のcron(busybox crond)。
  # 叩く先はホストのSpring Bootで、削除の判定はバックエンド側の責務。
  # スケジュールは ops/cron/crontab、実行内容は ops/cron/cleanup-expired-projects.sh。
  # 詳細は Zaoral-backend-springboot の README「期限切れプロジェクトの削除」参照。
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080}
      # 未設定でも up は通す(ここで必須にすると、cronのためにスタック全体が起動できなくなる)。
      # 未設定のまま実行されるとスクリプトが理由付きで失敗し、docker logs に出る
      CRON_SECRET: ${CRON_SECRET:-}
      # crontab の実行時刻はUTC基準(置き換え元のVercel Cronと同じ)。ホストのTZに依存させない
      TZ: UTC
    volumes:
      # busybox crond が読むのは /etc/crontabs/<ユーザー名>
      - ./ops/cron/crontab:/etc/crontabs/root:ro
      - ./ops/cron/cleanup-expired-projects.sh:/usr/local/bin/cleanup-expired-projects:ro
    # Docker Desktop では既定で解決できるが、Linuxホストでは明示しないと host.docker.internal が引けない
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # -f: フォアグラウンド実行(コンテナのPID 1として動かす) / -l 8: crond自身のログを出させる
    command: >
      sh -c "apk add --no-cache curl > /dev/null &&
             export -p > /etc/cron.env &&
             exec crond -f -l 8"

  # pgAdmin（DBをブラウザから確認する用）
  # 使用方法: http://localhost:5050 （ログイン: admin@zaoral.dev / admin）
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zaoral.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - zaoral_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  zaoral_postgres_data:
  zaoral_pgadmin_data:
  # migrate と app で node_modules を共有する
  zaoral_node_modules:


