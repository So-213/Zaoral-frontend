# Zaoral - Docker Compose 設定
# ローカル開発・本番環境で使用可能

services:
  # PostgreSQL データベース
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaoral
      POSTGRES_PASSWORD: zaoral_dev_password
      POSTGRES_DB: zaoral
    ports:
      - "5432:5432"
    volumes:
      - zaoral_postgres_data:/var/lib/postgresql/data
      # ロール(zaoral_migrator / zaoral_app)を作成する初期化SQL。
      # 初回起動時(=上のボリュームが空のとき)のみ実行される
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaoral -d zaoral"]
      interval: 5s
      timeout: 5s
      retries: 5

  # DB作成プロセス。スキーマを適用する唯一の主体で、流し終えたら終了する(常駐しない)。
  # DDL権限を持つ zaoral_migrator で接続するのはここだけ。
  # SQLは ops/db/migration/、ロール定義は ops/db/init/01-roles.sql、運用は ops/db/README.md 参照
  migrate:
    image: flyway/flyway:11-alpine
    command: >
      -url=jdbc:postgresql://db:5432/zaoral
      -user=zaoral_migrator
      -password=${DB_MIGRATOR_PASSWORD:-zaoral_migrator_dev_password}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./ops/db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Next.js アプリケーション
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # データベース（Docker Compose 内のサービス名で接続）
      # DMLのみ許可されたロール。マイグレーションは migrate サービスの責務
      DATABASE_URL: postgresql://zaoral_app:${DB_APP_PASSWORD:-zaoral_app_dev_password}@db:5432/zaoral
      DIRECT_URL: postgresql://zaoral_app:${DB_APP_PASSWORD:-zaoral_app_dev_password}@db:5432/zaoral
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # OAuth（.env で設定）
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_LINE_ID: ${AUTH_LINE_ID}
      AUTH_LINE_SECRET: ${AUTH_LINE_SECRET}
      # AWS S3（.env で設定）
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # その他
      NEXT_PUBLIC_PROJECT_DISPLAY_URL: ${NEXT_PUBLIC_PROJECT_DISPLAY_URL:-http://localhost:3000}
    depends_on:
      # マイグレーションが正常終了(終了コード0)するまでappを起動しない
      migrate:
        condition: service_completed_successfully

volumes:
  zaoral_postgres_data:
