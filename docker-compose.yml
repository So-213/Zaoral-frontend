# Zaoral - Docker Compose 設定
# ローカル開発・本番環境で使用可能

services:
  # PostgreSQL データベース
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaoral
      POSTGRES_PASSWORD: zaoral_dev_password
      POSTGRES_DB: zaoral
    ports:
      - "5432:5432"
    volumes:
      - zaoral_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaoral -d zaoral"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js アプリケーション
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # データベース（Docker Compose 内のサービス名で接続）
      DATABASE_URL: postgresql://zaoral:zaoral_dev_password@db:5432/zaoral
      DIRECT_URL: postgresql://zaoral:zaoral_dev_password@db:5432/zaoral
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # OAuth（.env で設定）
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_LINE_ID: ${AUTH_LINE_ID}
      AUTH_LINE_SECRET: ${AUTH_LINE_SECRET}
      # AWS S3（.env で設定）
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      # その他
      NEXT_PUBLIC_PROJECT_DISPLAY_URL: ${NEXT_PUBLIC_PROJECT_DISPLAY_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  zaoral_postgres_data:
